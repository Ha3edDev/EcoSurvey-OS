<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>سامانه پژوهشی EconGraph</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root {
  --primary: #00d2d3;
  --accent: #5f27cd;
  --bg-body: #0f1720;
  --card-bg: rgba(20,25,35,0.78);
  --card-border: rgba(255,255,255,0.08);
  --text-main: #f5f6fa;
  --text-sub: #a4b0be;
  --input-bg: rgba(255,255,255,0.05);
  --border-color: rgba(255,255,255,0.08);
  --shadow: 0 25px 50px rgba(0,0,0,0.45);
  --blob-1: #00d2d3;
  --blob-2: #5f27cd;
  --radius: 28px;
}
body.theme-crimson { --primary:#ff4757; --accent:#ff6b81; --bg-body:#1c1114; --card-bg:rgba(40,20,25,0.78); --blob-1:#ff4757; --blob-2:#ff6b81; }
body.theme-corporate { --primary:#0984e3; --accent:#74b9ff; --bg-body:#0f172a; --card-bg:rgba(15,23,42,0.82); --blob-1:#0984e3; --blob-2:#74b9ff; }
body.theme-nature { --primary:#2d6a4f; --accent:#95d5b2; --bg-body:#0b1913; --card-bg:rgba(18,35,28,0.82); --blob-1:#2d6a4f; --blob-2:#95d5b2; }
body.theme-sunset { --primary:#f0932b; --accent:#e55039; --bg-body:#1a0e0a; --card-bg:rgba(35,18,12,0.82); --blob-1:#f0932b; --blob-2:#e55039; }

*{ margin:0; padding:0; box-sizing:border-box; outline:none; }

body {
  font-family:'Vazirmatn',sans-serif;
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  color:var(--text-main);
  background:
    radial-gradient(circle at top left, rgba(0,210,211,0.12), transparent 35%),
    radial-gradient(circle at bottom right, rgba(95,39,205,0.12), transparent 35%),
    var(--bg-body);
  transition:background .4s ease, color .4s ease;
}

.background-animation { position:fixed; inset:0; overflow:hidden; z-index:-1; }
.blob { position:absolute; width:50vw; height:50vw; border-radius:50%; filter:blur(90px); opacity:.18; animation:float 18s infinite alternate ease-in-out; }
.blob.one { top:-10%; left:-10%; background:var(--blob-1); }
.blob.two { bottom:-10%; right:-10%; background:var(--blob-2); }
@keyframes float { from { transform:translate(0,0) scale(1); } to { transform:translate(40px,-40px) scale(1.1); } }

.container {
  width:100%;
  max-width:460px;
  position:relative;
  overflow:hidden;
  border-radius:var(--radius);
  border:1px solid var(--card-border);
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
  padding:35px 25px;
}

.progress-wrapper { position:absolute; top:0; right:0; width:100%; height:4px; background:rgba(255,255,255,0.04); }
.progress-bar { height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--accent)); transition:width .35s ease; box-shadow:0 0 12px var(--primary); }

h1 { text-align:center; font-size:1.85rem; margin-bottom:10px; font-weight:900; }
.subtitle { text-align:center; color:var(--text-sub); line-height:1.9; margin-bottom:28px; font-size:.9rem; }
h3 { line-height:1.8; margin-bottom:20px; font-size:1rem; font-weight:700; }

.form-group { margin-bottom:16px; }
.label { display:block; margin-bottom:7px; font-size:.88rem; color:var(--text-sub); }

.form-control {
  width:100%;
  border:1px solid var(--border-color);
  background:var(--input-bg);
  color:var(--text-main);
  border-radius:14px;
  padding:13px 15px;
  font-family:inherit;
  font-size:.95rem;
  backdrop-filter:blur(12px);
  transition:.25s ease;
}
.form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(0,210,211,0.1); }
.form-control::placeholder { color:var(--text-sub); }

textarea.form-control { resize:none; min-height:72px; }

.radio-option {
  display:flex;
  align-items:center;
  width:100%;
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:16px;
  border:1px solid var(--border-color);
  background:rgba(255,255,255,0.02);
  cursor:pointer;
  transition:.2s ease;
  font-size:.93rem;
  line-height:1.5;
}
.radio-option:hover { transform:translateY(-1px); border-color:rgba(255,255,255,0.14); background:rgba(255,255,255,0.04); }
.radio-option input { display:none; }
.radio-option:has(input:checked) {
  border-color:var(--primary);
  color:var(--primary);
  background:rgba(0,210,211,0.06);
  box-shadow:0 0 0 1px var(--primary);
}

.comment-box {
  margin-top:6px;
  margin-bottom:4px;
}
.comment-box textarea {
  font-size:.85rem;
  padding:10px 13px;
  min-height:58px;
  border-radius:12px;
  color:var(--text-sub);
}
.comment-box textarea:focus { color:var(--text-main); }

.nav-buttons { display:flex; gap:12px; margin-top:26px; }

button { border:none; cursor:pointer; font-family:inherit; transition:.25s ease; }
button:hover { transform:translateY(-2px); }

.btn-primary {
  flex:2;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  padding:14px;
  font-size:.95rem;
  font-weight:800;
  color:white;
  background:linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow:0 8px 24px rgba(0,0,0,0.18);
}
.btn-primary::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.22), transparent);
  transform:translateX(-100%);
  transition:.6s;
}
.btn-primary:hover::before { transform:translateX(100%); }

.btn-secondary {
  flex:1;
  border-radius:14px;
  padding:14px;
  background:transparent;
  color:var(--text-sub);
  border:1px solid var(--border-color);
}

/* ── THEME SELECTOR ── */
.theme-selector { margin-top:22px; }
.theme-title { text-align:center; color:var(--text-sub); margin-bottom:12px; font-size:.85rem; }
.theme-options { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

.theme-card {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
  padding:8px 10px;
  border-radius:12px;
  border:1.5px solid transparent;
  transition:.2s ease;
  background:rgba(255,255,255,0.03);
}
.theme-card:hover { background:rgba(255,255,255,0.06); }
.theme-card.active { border-color:var(--primary); background:rgba(255,255,255,0.06); }
.theme-dot { width:26px; height:26px; border-radius:50%; }
.theme-dot.neon    { background:linear-gradient(135deg,#00d2d3,#5f27cd); }
.theme-dot.crimson { background:linear-gradient(135deg,#ff4757,#ff6b81); }
.theme-dot.corporate { background:linear-gradient(135deg,#0984e3,#74b9ff); }
.theme-dot.nature  { background:linear-gradient(135deg,#2d6a4f,#95d5b2); }
.theme-dot.sunset  { background:linear-gradient(135deg,#f0932b,#e55039); }
.theme-name { font-size:.72rem; color:var(--text-sub); }
.theme-card.active .theme-name { color:var(--primary); }

/* ── AVATAR SECTION ── */
.avatar-section { margin-bottom:26px; }
.avatar-title { text-align:center; color:var(--text-sub); margin-bottom:14px; font-size:.88rem; }
.avatar-grid { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

.av-item { display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; }
.av-ring {
  width:74px; height:74px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);
  display:flex; align-items:center; justify-content:center;
  transition:border-color .2s, transform .15s, background .2s;
}
.av-item:hover .av-ring { transform:translateY(-3px); border-color:rgba(255,255,255,0.25); background:rgba(255,255,255,0.07); }
.av-item.selected .av-ring { border:2px solid var(--primary); background:rgba(0,210,211,0.08); box-shadow:0 0 0 3px rgba(0,210,211,0.12); }
.av-name { font-size:.75rem; color:var(--text-sub); }
.av-item.selected .av-name { color:var(--primary); font-weight:700; }

/* ── SCREENS ── */
.hidden { display:none !important; }
.screen { animation:fade .4s ease; }
@keyframes fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

#question-box { min-height:220px; }

.loader { width:40px; height:40px; border-radius:50%; border:3px solid rgba(255,255,255,0.08); border-top-color:var(--primary); margin:auto; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── REFERRAL ── */
.referral-box { margin-top:22px; text-align:right; }
.referral-box label { display:block; margin-bottom:9px; color:var(--text-sub); font-size:.88rem; }
.referral-row { display:flex; gap:10px; }
.copy-btn { min-width:80px; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; font-weight:bold; padding:12px; font-size:.88rem; }

.signature { margin-top:24px; font-size:.78rem; color:var(--text-sub); }
.signature span { color:var(--primary); font-weight:bold; }

@media(max-width:480px){
  body { padding:12px; }
  .container { padding:24px 16px; }
  .referral-row { flex-direction:column; }
  h1 { font-size:1.55rem; }
  .av-ring { width:62px; height:62px; }
}
</style>
</head>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzxljrF2WvzSJ0xFtxEoFh8Y5QSwg-Kp2LxO-nSJzzoZ10JzYdqcWk3g0vwrHg4Dru0AA/exec";

const state = {
  currentQuestion: 0,
  currentTheme: "neon",
  selectedAvatar: "",
  questions: [],
  answers: {},
  comments: {},
  timeLogs: {},
  config: {}
};

let questionStartTime = 0;

const screens = {
  start: document.getElementById("start-screen"),
  quiz:  document.getElementById("quiz-screen"),
  end:   document.getElementById("end-screen")
};

window.addEventListener("DOMContentLoaded", initApp);

async function initApp() {
  loadTheme();
  try {
    const response = await fetch(API_URL);
    const data = await response.json();
    state.questions = data.questions || [];
    state.config = data.config || {};
    initializeUI();
    setScreen("start");
  } catch(e) {
    console.error(e);
    alert("خطا در اتصال");
  } finally {
    document.getElementById("loader").classList.add("hidden");
  }
}

function setScreen(s) {
  Object.values(screens).forEach(el => el.classList.add("hidden"));
  screens[s].classList.remove("hidden");
}

function initializeUI() {
  if(state.config.title) document.getElementById("site-title").innerText = state.config.title;
  if(state.config.subtitle) document.getElementById("site-subtitle").innerText = state.config.subtitle;
}

function pickAvatar(el, name) {
  document.querySelectorAll(".av-item").forEach(i => i.classList.remove("selected"));
  el.classList.add("selected");
  state.selectedAvatar = name;
}

function changeTheme(theme) {
  document.body.className = "";
  if(theme !== "neon") document.body.classList.add("theme-" + theme);
  localStorage.setItem("econ_theme", theme);
  state.currentTheme = theme;
  document.querySelectorAll(".theme-card").forEach(btn => {
    btn.classList.remove("active");
    if(btn.querySelector("." + theme)) btn.classList.add("active");
  });
}

function loadTheme() {
  const saved = localStorage.getItem("econ_theme") || "neon";
  changeTheme(saved);
}

function startQuiz() {
  const name = document.getElementById("user-name").value.trim();
  const age  = document.getElementById("user-age").value.trim();
  if(!name || !age) { alert("لطفاً اطلاعات را کامل کنید"); return; }
  state.currentQuestion = 0;
  setScreen("quiz");
  showQuestion();
}

function showQuestion() {
  const q = state.questions[state.currentQuestion];
  const box = document.getElementById("question-box");
  updateProgress();
  questionStartTime = Date.now();
  const saved = state.answers[q.id] || "";
  const savedComment = state.comments[q.id] || "";

  let html = "";

  if(q.type === "radio") {
    html = q.options.map(opt => {
      const checked = saved === opt ? "checked" : "";
      const safeOpt = opt.replace(/"/g, "&quot;");
      return `<label class="radio-option"><input type="radio" name="question" value="${safeOpt}" ${checked} onchange="saveAnswer('${q.id}','${safeOpt}')"> ${opt}</label>`;
    }).join("");
  }

  if(q.type === "text") {
    html = `<textarea class="form-control" rows="4" placeholder="پاسخ خود را وارد کنید..." oninput="saveAnswer('${q.id}',this.value)">${saved}</textarea>`;
  }

  if(q.type === "number") {
    html = `<input type="number" class="form-control" value="${saved}" placeholder="عدد" oninput="saveAnswer('${q.id}',this.value)">`;
  }

  box.innerHTML = `
    <h3>${state.currentQuestion + 1}. ${q.text}</h3>
    ${html}
    <div class="comment-box">
      <textarea class="form-control" placeholder="نظر یا توضیح اضافه‌ای دارید؟ (اختیاری)" oninput="saveComment('${q.id}',this.value)">${savedComment}</textarea>
    </div>
  `;

  updateButtons();
}

function saveAnswer(id, value) { state.answers[id] = value; }
function saveComment(id, value) { state.comments[id] = value; }

function nextStep() {
  const q = state.questions[state.currentQuestion];
  if(q.required && !state.answers[q.id]) { alert("این سوال الزامی است"); return; }
  state.timeLogs[q.id] = ((Date.now() - questionStartTime) / 1000).toFixed(1);
  if(state.currentQuestion >= state.questions.length - 1) { submitData(); return; }
  state.currentQuestion++;
  showQuestion();
}

function prevStep() {
  if(state.currentQuestion <= 0) return;
  state.currentQuestion--;
  showQuestion();
}

function updateButtons() {
  const prev = document.getElementById("btn-prev");
  const next = document.getElementById("btn-next");
  prev.style.visibility = state.currentQuestion === 0 ? "hidden" : "visible";
  next.innerText = state.currentQuestion === state.questions.length - 1 ? "ثبت نهایی" : "بعدی";
}

function updateProgress() {
  const pct = ((state.currentQuestion + 1) / state.questions.length) * 100;
  document.getElementById("progress-bar").style.width = pct + "%";
}

async function submitData() {
  const btn = document.getElementById("btn-next");
  btn.disabled = true;
  btn.innerText = "در حال ارسال...";

  const = state.questions.map((q, i) => ({
    questionIndex: i + 1,
    qId: i + 1,       // ← اینجا
    answer:  state.answers[q.id]  || "",
    comment: state.comments[q.id] || "",
    time:    state.timeLogs[q.id] || 0
  }));

  const totalTime = Object.values(state.timeLogs).reduce((sum, t) => sum + parseFloat(t || 0), 0).toFixed(1);

  const payload = {
    surveyName: state.config.title || "EconGraph",
    name:       document.getElementById("user-name").value,
    age:        document.getElementById("user-age").value,
    avatar:     state.selectedAvatar,
    source:     new URLSearchParams(window.location.search).get("ref") || "direct",
    theme:      state.currentTheme,
    totalTime:  totalTime,
    answers:    answersArr
  };

  try {
    await fetch(API_URL, { method:"POST", body:JSON.stringify(payload) });
    generateReferralLink();
    setScreen("end");
  } catch(e) {
    console.error(e);
    alert("خطا در ارسال اطلاعات");
    btn.disabled = false;
    btn.innerText = "تلاش مجدد";
  }
}

function generateReferralLink() {
  const name = document.getElementById("user-name").value.trim();
  document.getElementById("referral-link").value =
    window.location.origin + window.location.pathname + "?ref=" + encodeURIComponent(name);
}

async function copyReferralLink() {
  const input = document.getElementById("referral-link");
  try {
    await navigator.clipboard.writeText(input.value);
    alert("لینک کپی شد");
  } catch {
    input.select();
    document.execCommand("copy");
    alert("لینک کپی شد");
  }
}
</script>
</body>
</html>
