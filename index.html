<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>سامانه پژوهشی EconGraph</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
        rel="stylesheet">

    <style>

        /* =========================================================
           THEME SYSTEM
        ========================================================= */

        :root {

            --font-main: 'Vazirmatn', sans-serif;

            --primary: #00d2d3;
            --accent: #5f27cd;

            --bg-body: #0f1720;

            --card-bg:
                rgba(20, 25, 35, 0.78);

            --card-border:
                rgba(255,255,255,0.08);

            --text-main: #f5f6fa;
            --text-sub: #a4b0be;

            --input-bg:
                rgba(255,255,255,0.04);

            --border-color:
                rgba(255,255,255,0.08);

            --shadow:
                0 25px 50px rgba(0,0,0,0.45);

            --blob-1: #00d2d3;
            --blob-2: #5f27cd;

            --radius: 28px;
        }

        body.theme-crimson {

            --primary: #ff4757;
            --accent: #990033;

            --bg-body: #1c1114;

            --card-bg:
                rgba(40,20,25,0.78);

            --blob-1: #ff4757;
            --blob-2: #ff6b81;
        }

        body.theme-corporate {

            --primary: #0984e3;
            --accent: #74b9ff;

            --bg-body: #0f172a;

            --card-bg:
                rgba(15,23,42,0.82);

            --blob-1: #0984e3;
            --blob-2: #74b9ff;
        }

        body.theme-nature {

            --primary: #2d6a4f;
            --accent: #95d5b2;

            --bg-body: #0b1913;

            --card-bg:
                rgba(18,35,28,0.82);

            --blob-1: #2d6a4f;
            --blob-2: #95d5b2;
        }

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
            outline: none;
        }

        body {

            font-family: var(--font-main);

            min-height: 100vh;

            padding: 20px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            overflow-x: hidden;

            color: var(--text-main);

            background:

                radial-gradient(
                    circle at top left,
                    rgba(0,210,211,0.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(95,39,205,0.15),
                    transparent 30%
                ),

                var(--bg-body);

            transition:
                background .4s ease,
                color .4s ease;
        }

        /* =========================================================
           BACKGROUND BLOBS
        ========================================================= */

        .background-animation {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: -1;
        }

        .blob {

            position: absolute;

            width: 50vw;
            height: 50vw;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.22;

            animation:
                float 18s infinite alternate ease-in-out;
        }

        .blob.one {

            top: -10%;
            left: -10%;

            background: var(--blob-1);
        }

        .blob.two {

            bottom: -10%;
            right: -10%;

            background: var(--blob-2);
        }

        @keyframes float {

            from {

                transform:
                    translate(0px,0px)
                    scale(1);
            }

            to {

                transform:
                    translate(40px,-40px)
                    scale(1.1);
            }
        }

        /* =========================================================
           CONTAINER
        ========================================================= */

        .container {

            width: 100%;
            max-width: 440px;

            position: relative;

            overflow: hidden;

            border-radius: var(--radius);

            border:
                1px solid var(--card-border);

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.05),
                    rgba(255,255,255,0.02)
                );

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow: var(--shadow);

            padding: 35px 25px;
        }

        /* =========================================================
           PROGRESS
        ========================================================= */

        .progress-wrapper {

            position: absolute;

            top: 0;
            right: 0;

            width: 100%;
            height: 5px;

            background:
                rgba(255,255,255,0.04);
        }

        .progress-bar {

            height: 100%;
            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--accent)
                );

            transition: width .35s ease;

            box-shadow:
                0 0 20px var(--primary);
        }

        /* =========================================================
           TYPOGRAPHY
        ========================================================= */

        h1 {

            text-align: center;

            font-size: 1.9rem;

            margin-bottom: 12px;

            font-weight: 900;
        }

        .subtitle {

            text-align: center;

            color: var(--text-sub);

            line-height: 1.9;

            margin-bottom: 30px;

            font-size: .95rem;
        }

        h3 {

            line-height: 2;

            margin-bottom: 24px;

            font-size: 1.05rem;
        }

        /* =========================================================
           FORM
        ========================================================= */

        .form-group {

            margin-bottom: 18px;
        }

        .label {

            display: block;

            margin-bottom: 8px;

            font-size: .9rem;

            color: var(--text-sub);
        }

        .form-control {

            width: 100%;

            border:
                1px solid var(--border-color);

            background:
                var(--input-bg);

            color: var(--text-main);

            border-radius: 16px;

            padding: 15px;

            font-family: inherit;

            font-size: 1rem;

            backdrop-filter: blur(12px);

            transition: .25s ease;
        }

        .form-control:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(0,210,211,0.1);
        }

        .form-control::placeholder {

            color: var(--text-sub);
        }

        /* =========================================================
           OPTIONS
        ========================================================= */

        .radio-option {

            display: flex;
            align-items: center;

            width: 100%;

            padding: 16px;

            margin-bottom: 12px;

            border-radius: 18px;

            border:
                1px solid var(--border-color);

            background:
                rgba(255,255,255,0.03);

            cursor: pointer;

            transition: .25s ease;
        }

        .radio-option:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(255,255,255,0.15);
        }

        .radio-option input {

            display: none;
        }

        .radio-option:has(input:checked) {

            border-color: var(--primary);

            color: var(--primary);

            background:
                rgba(0,210,211,0.06);

            box-shadow:
                0 0 0 1px var(--primary);
        }

        /* =========================================================
           BUTTONS
        ========================================================= */

        .nav-buttons {

            display: flex;

            gap: 12px;

            margin-top: 28px;
        }

        button {

            border: none;

            cursor: pointer;

            font-family: inherit;

            transition: .25s ease;
        }

        button:hover {

            transform:
                translateY(-2px);
        }

        .btn-primary {

            flex: 2;

            position: relative;

            overflow: hidden;

            border-radius: 16px;

            padding: 15px;

            font-size: 1rem;

            font-weight: 800;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--accent)
                );

            box-shadow:
                0 10px 30px rgba(0,0,0,0.18);
        }

        .btn-primary::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent,
                    rgba(255,255,255,0.28),
                    transparent
                );

            transform:
                translateX(-100%);

            transition: .7s;
        }

        .btn-primary:hover::before {

            transform:
                translateX(100%);
        }

        .btn-secondary {

            flex: 1;

            border-radius: 16px;

            padding: 15px;

            background:
                transparent;

            color: var(--text-sub);

            border:
                1px solid var(--border-color);
        }

        /* =========================================================
           THEMES
        ========================================================= */

        .theme-selector {

            margin-top: 25px;
        }

        .theme-title {

            text-align: center;

            color: var(--text-sub);

            margin-bottom: 14px;

            font-size: .9rem;
        }

        .theme-options {

            display: flex;

            justify-content: center;

            gap: 12px;
        }

        .theme-btn {

            width: 28px;
            height: 28px;

            border-radius: 50%;

            border:
                3px solid transparent;

            cursor: pointer;
        }

        .theme-btn.active {

            border-color: white;

            box-shadow:
                0 0 14px rgba(255,255,255,0.5);
        }

        .theme-btn.neon {

            background:
                linear-gradient(
                    135deg,
                    #00d2d3,
                    #5f27cd
                );
        }

        .theme-btn.crimson {

            background:
                linear-gradient(
                    135deg,
                    #ff4757,
                    #990033
                );
        }

        .theme-btn.corporate {

            background:
                linear-gradient(
                    135deg,
                    #0984e3,
                    #74b9ff
                );
        }

        .theme-btn.nature {

            background:
                linear-gradient(
                    135deg,
                    #2d6a4f,
                    #95d5b2
                );
        }

        /* =========================================================
           REFERRAL
        ========================================================= */

        .referral-box {

            margin-top: 25px;

            text-align: right;
        }

        .referral-box label {

            display: block;

            margin-bottom: 10px;

            color: var(--text-sub);
        }

        .referral-row {

            display: flex;

            gap: 10px;
        }

        .copy-btn {

            min-width: 90px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--accent)
                );

            color: white;

            font-weight: bold;
        }

        /* =========================================================
           SCREENS
        ========================================================= */

        .hidden {

            display: none !important;
        }

        .screen {

            animation:
                fade .45s ease;
        }

        @keyframes fade {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0px);
            }
        }

        /* =========================================================
           QUESTION BOX
        ========================================================= */

        #question-box {

            min-height: 240px;
        }

        /* =========================================================
           LOADER
        ========================================================= */

        .loader {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border:
                4px solid rgba(255,255,255,0.08);

            border-top-color:
                var(--primary);

            margin: auto;

            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }

        /* =========================================================
           SIGNATURE
        ========================================================= */

        .signature {

            margin-top: 28px;

            font-size: .8rem;

            color: var(--text-sub);
        }

        .signature span {

            color: var(--primary);

            font-weight: bold;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media(max-width:480px){

            body {

                padding: 14px;
            }

            .container {

                padding: 26px 18px;
            }

            .referral-row {

                flex-direction: column;
            }

            h1 {

                font-size: 1.6rem;
            }
        }

    </style>

</head>

<body>

    <div class="background-animation">

        <div class="blob one"></div>

        <div class="blob two"></div>

    </div>

    <div class="container">

        <div class="progress-wrapper">

            <div
                id="progress-bar"
                class="progress-bar"></div>

        </div>

        <div
            id="loader"
            class="loader"></div>

        <!-- =====================================================
             START SCREEN
        ====================================================== -->

        <div
            id="start-screen"
            class="screen hidden">

            <h1 id="site-title">
                سامانه پژوهشی EconGraph
            </h1>

            <p
                id="site-subtitle"
                class="subtitle">

                لطفاً اطلاعات خود را وارد کنید
            </p>

            <div class="form-group">

                <label class="label">
                    نام شما
                </label>

                <input
                    type="text"
                    id="user-name"
                    class="form-control"
                    placeholder="مثلاً علی">
            </div>

            <div class="form-group">

                <label class="label">
                    سن
                </label>

                <input
                    type="number"
                    id="user-age"
                    class="form-control"
                    placeholder="مثلاً 22">
            </div>

            <div class="theme-selector">

                <div class="theme-title">

                    انتخاب تم
                </div>

                <div class="theme-options">

                    <button
                        class="theme-btn neon"
                        onclick="changeTheme('neon')"></button>

                    <button
                        class="theme-btn crimson"
                        onclick="changeTheme('crimson')"></button>

                    <button
                        class="theme-btn corporate"
                        onclick="changeTheme('corporate')"></button>

                    <button
                        class="theme-btn nature"
                        onclick="changeTheme('nature')"></button>

                </div>

            </div>

            <div class="nav-buttons">

                <button
                    class="btn-primary"
                    onclick="startQuiz()">

                    شروع آزمون

                </button>

            </div>

        </div>

        <!-- =====================================================
             QUIZ SCREEN
        ====================================================== -->

        <div
            id="quiz-screen"
            class="screen hidden">

            <div id="question-box"></div>

            <div class="nav-buttons">

                <button
                    id="btn-prev"
                    class="btn-secondary"
                    onclick="prevStep()">

                    قبلی

                </button>

                <button
                    id="btn-next"
                    class="btn-primary"
                    onclick="nextStep()">

                    بعدی

                </button>

            </div>

        </div>

        <!-- =====================================================
             END SCREEN
        ====================================================== -->

        <div
            id="end-screen"
            class="screen hidden"
            style="text-align:center;">

            <div style="font-size:4rem;">
                🎉
            </div>

            <h2 style="margin-top:10px;">

                ثبت شد

            </h2>

            <p
                style="
                    color:var(--text-sub);
                    margin-top:10px;
                    line-height:1.9;
                ">

                پاسخ‌های شما با موفقیت ذخیره شد.

            </p>

            <div class="referral-box">

                <label>

                    لینک دعوت اختصاصی شما

                </label>

                <div class="referral-row">

                    <input
                        type="text"
                        id="referral-link"
                        class="form-control"
                        readonly>

                    <button
                        class="copy-btn"
                        onclick="copyReferralLink()">

                        کپی

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="signature">

        Designed for
        <span>Economic Research</span>

    </div>

    <script>

        /* =========================================================
           API
        ========================================================= */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbzxljrF2WvzSJ0xFtxEoFh8Y5QSwg-Kp2LxO-nSJzzoZ10JzYdqcWk3g0vwrHg4Dru0AA/exec";

        /* =========================================================
           STATE
        ========================================================= */

        const state = {

            currentQuestion: 0,

            currentTheme: "neon",

            questions: [],

            answers: {},

            timeLogs: {},

            config: {}
        };

        let questionStartTime = 0;

        /* =========================================================
           DOM
        ========================================================= */

        const screens = {

            start:
                document.getElementById("start-screen"),

            quiz:
                document.getElementById("quiz-screen"),

            end:
                document.getElementById("end-screen")
        };

        /* =========================================================
           INIT
        ========================================================= */

        window.addEventListener(
            "DOMContentLoaded",
            initApp
        );

        async function initApp() {

            loadTheme();

            try {

                const response =
                    await fetch(API_URL);

                const data =
                    await response.json();

                state.questions =
                    data.questions || [];

                state.config =
                    data.config || {};

                initializeUI();

                setScreen("start");

            } catch(error){

                console.error(error);

                alert("خطا در اتصال");
            }

            finally {

                document
                    .getElementById("loader")
                    .classList
                    .add("hidden");
            }
        }

        /* =========================================================
           UI
        ========================================================= */

        function setScreen(screen){

            Object
                .values(screens)
                .forEach(el=>{

                    el.classList.add("hidden");
                });

            screens[screen]
                .classList
                .remove("hidden");
        }

        function initializeUI(){

            if(state.config.title){

                document
                    .getElementById("site-title")
                    .innerText =
                    state.config.title;
            }

            if(state.config.subtitle){

                document
                    .getElementById("site-subtitle")
                    .innerText =
                    state.config.subtitle;
            }
        }

        /* =========================================================
           THEMES
        ========================================================= */

        function changeTheme(theme){

            document.body.className = "";

            if(theme !== "neon"){

                document.body.classList.add(
                    `theme-${theme}`
                );
            }

            localStorage.setItem(
                "econ_theme",
                theme
            );

            state.currentTheme = theme;

            updateThemeButtons(theme);
        }

        function loadTheme(){

            const savedTheme =
                localStorage.getItem("econ_theme")
                || "neon";

            changeTheme(savedTheme);
        }

        function updateThemeButtons(theme){

            document
                .querySelectorAll(".theme-btn")
                .forEach(btn=>{

                    btn.classList.remove("active");

                    if(btn.classList.contains(theme)){

                        btn.classList.add("active");
                    }
                });
        }

        /* =========================================================
           QUIZ
        ========================================================= */

        function startQuiz(){

            const name =
                document
                .getElementById("user-name")
                .value
                .trim();

            const age =
                document
                .getElementById("user-age")
                .value
                .trim();

            if(!name || !age){

                alert("لطفاً اطلاعات را کامل کنید");

                return;
            }

            state.currentQuestion = 0;

            setScreen("quiz");

            showQuestion();
        }

        function showQuestion(){

            const question =
                state.questions[
                    state.currentQuestion
                ];

            const box =
                document
                .getElementById("question-box");

            updateProgress();

            questionStartTime = Date.now();

            const saved =
                state.answers[question.id]
                || "";

            let html = "";

            if(question.type === "radio"){

                html =
                    question.options
                    .map(option=>{

                        const checked =
                            saved === option
                            ? "checked"
                            : "";

                        return `

                            <label class="radio-option">

                                <input
                                    type="radio"
                                    name="question"
                                    value="${option}"
                                    ${checked}
                                    onchange="saveAnswer('${question.id}','${option}')"
                                >

                                ${option}

                            </label>

                        `;
                    })
                    .join("");
            }

            if(question.type === "text"){

                html = `

                    <textarea
                        class="form-control"
                        rows="4"
                        placeholder="پاسخ خود را وارد کنید..."
                        oninput="saveAnswer('${question.id}', this.value)"
                    >${saved}</textarea>

                `;
            }

            if(question.type === "number"){

                html = `

                    <input
                        type="number"
                        class="form-control"
                        value="${saved}"
                        placeholder="عدد"
                        oninput="saveAnswer('${question.id}', this.value)"
                    >

                `;
            }

            box.innerHTML = `

                <h3>

                    ${state.currentQuestion + 1}.
                    ${question.text}

                </h3>

                ${html}

            `;

            updateButtons();
        }

        function saveAnswer(id,value){

            state.answers[id] = value;
        }

        function nextStep(){

            const question =
                state.questions[
                    state.currentQuestion
                ];

            if(
                question.required &&
                !state.answers[question.id]
            ){

                alert("این سوال الزامی است");

                return;
            }

            state.timeLogs[question.id] =

                (
                    (Date.now() - questionStartTime)
                    / 1000
                ).toFixed(1);

            if(
                state.currentQuestion >=
                state.questions.length - 1
            ){

                submitData();

                return;
            }

            state.currentQuestion++;

            showQuestion();
        }

        function prevStep(){

            if(state.currentQuestion <= 0)
                return;

            state.currentQuestion--;

            showQuestion();
        }

        function updateButtons(){

            const prev =
                document.getElementById("btn-prev");

            const next =
                document.getElementById("btn-next");

            prev.style.visibility =

                state.currentQuestion === 0
                ? "hidden"
                : "visible";

            next.innerText =

                state.currentQuestion ===
                state.questions.length - 1

                ? "ثبت نهایی"

                : "بعدی";
        }

        function updateProgress(){

            const progress =

                (
                    (state.currentQuestion + 1)
                    / state.questions.length
                ) * 100;

            document
                .getElementById("progress-bar")
                .style.width = `${progress}%`;
        }

        /* =========================================================
           SUBMIT
        ========================================================= */

        async function submitData(){

            const btn =
                document.getElementById("btn-next");

            btn.disabled = true;

            btn.innerText =
                "در حال ارسال...";

            const payload = {

                name:
                    document
                    .getElementById("user-name")
                    .value,

                age:
                    document
                    .getElementById("user-age")
                    .value,

                source:
                    new URLSearchParams(
                        window.location.search
                    )
                    .get("ref")
                    || "direct",

                theme:
                    state.currentTheme,

                answers:

                    Object
                    .entries(state.answers)

                    .map(([qId,answer])=>({

                        qId,

                        answer,

                        time:
                            state.timeLogs[qId]
                            || 0
                    }))
            };

            try {

                await fetch(API_URL, {

                    method: "POST",

                    body:
                        JSON.stringify(payload)
                });

                generateReferralLink();

                setScreen("end");

            } catch(error){

                console.error(error);

                alert("خطا در ارسال اطلاعات");

                btn.disabled = false;

                btn.innerText =
                    "تلاش مجدد";
            }
        }

        /* =========================================================
           REFERRAL
        ========================================================= */

        function generateReferralLink(){

            const name =

                document
                .getElementById("user-name")
                .value
                .trim();

            const link =

                `${window.location.origin}${window.location.pathname}?ref=${encodeURIComponent(name)}`;

            document
                .getElementById("referral-link")
                .value = link;
        }

        async function copyReferralLink(){

            const input =
                document
                .getElementById("referral-link");

            try {

                await navigator
                    .clipboard
                    .writeText(input.value);

                alert("لینک کپی شد");

            } catch {

                input.select();

                document.execCommand("copy");

                alert("لینک کپی شد");
            }
        }

    </script>

</body>

</html>
