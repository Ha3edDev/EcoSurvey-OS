<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>سامانه پژوهشی EconGraph</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <style>

        /* =========================================
           THEMES
        ========================================= */

        :root {
            --font-main: 'Vazirmatn', sans-serif;

            --primary: #00d2d3;
            --accent: #54a0ff;

            --bg-body: #1e272e;
            --card-bg: rgba(47, 54, 64, 0.95);

            --text-main: #f5f6fa;
            --text-sub: #a4b0be;

            --border-color: #576574;
            --input-bg: rgba(0,0,0,0.3);

            --card-radius: 24px;

            --blob-opacity: 0.25;

            --shadow-color: rgba(0,0,0,0.5);

            --blob-1: #00d2d3;
            --blob-2: #5f27cd;
        }

        body.theme-crimson {
            --primary: #990033;
            --accent: #ff4757;

            --bg-body: #f8f9fa;
            --card-bg: rgba(255,255,255,0.96);

            --text-main: #2d3436;
            --text-sub: #636e72;

            --border-color: #dfe6e9;
            --input-bg: #f1f2f6;

            --card-radius: 24px;

            --blob-opacity: .5;

            --shadow-color: rgba(0,0,0,.1);

            --blob-1: #ffcbd6;
            --blob-2: #e0e7ff;
        }

        body.theme-corporate {
            --primary: #0984e3;
            --accent: #74b9ff;

            --bg-body: #f1f2f6;
            --card-bg: #fff;

            --text-main: #2d3436;
            --text-sub: #636e72;

            --border-color: #dfe6e9;
            --input-bg: #f8f9fa;

            --card-radius: 16px;

            --blob-opacity: .4;

            --shadow-color: rgba(0,0,0,.08);

            --blob-1: #74b9ff;
            --blob-2: #81ecec;
        }

        body.theme-minimal {
            --primary: #000;
            --accent: #333;

            --bg-body: #fff;
            --card-bg: #fff;

            --text-main: #000;
            --text-sub: #666;

            --border-color: #000;
            --input-bg: transparent;

            --card-radius: 0px;

            --blob-opacity: .05;

            --shadow-color: transparent;

            --blob-1: #bdc3c7;
            --blob-2: #ecf0f1;
        }

        body.theme-cyberpunk {
            --font-main: 'Courier New', monospace;

            --primary: #fcee0a;
            --accent: #ff003c;

            --bg-body: #050505;
            --card-bg: #000;

            --text-main: #fcee0a;
            --text-sub: #00d2d3;

            --border-color: #fcee0a;
            --input-bg: #111;

            --card-radius: 0;

            --blob-opacity: .2;

            --shadow-color: rgba(255,0,60,.2);

            --blob-1: #ff003c;
            --blob-2: #00d2d3;
        }

        body.theme-nature {
            --primary: #2d6a4f;
            --accent: #d4a373;

            --bg-body: #eaf4f4;
            --card-bg: rgba(255,255,255,.9);

            --text-main: #1b4332;
            --text-sub: #52796f;

            --border-color: #b7e4c7;
            --input-bg: #f0fff4;

            --card-radius: 30px;

            --blob-opacity: .7;

            --shadow-color: rgba(45,106,79,.1);

            --blob-1: #95d5b2;
            --blob-2: #d8f3dc;
        }

        body.theme-frost {
            --primary: #fff;
            --accent: #a2d2ff;

            --bg-body: #a29bfe;
            --card-bg: rgba(255,255,255,.25);

            --text-main: #fff;
            --text-sub: #dfe6e9;

            --border-color: rgba(255,255,255,.4);
            --input-bg: rgba(255,255,255,.15);

            --card-radius: 24px;

            --blob-opacity: .5;

            --shadow-color: rgba(31,38,135,.37);

            --blob-1: #fd79a8;
            --blob-2: #0984e3;
        }

        /* =========================================
           CORE
        ========================================= */

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: var(--font-main);

            background-color: var(--bg-body);

            color: var(--text-main);

            display: flex;
            justify-content: center;
            align-items: center;

            flex-direction: column;

            min-height: 100vh;

            margin: 0;

            padding: 25px;

            overflow-x: hidden;

            transition:
                background-color .6s ease,
                color .5s ease;
        }

        .background-animation {
            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: -1;

            pointer-events: none;
        }

        .blob {
            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: var(--blob-opacity);

            animation: float 25s infinite alternate linear;

            transition:
                background .8s ease,
                opacity .8s ease;
        }

        .b1 {
            top: -10%;
            left: -10%;

            width: 60vw;
            height: 60vw;

            background: var(--blob-1);
        }

        .b2 {
            bottom: -10%;
            right: -10%;

            width: 60vw;
            height: 60vw;

            background: var(--blob-2);

            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0,0);
            }
            100% {
                transform: translate(30px,-30px);
            }
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            padding: 35px 25px;

            border-radius: var(--card-radius);

            box-shadow: 0 25px 50px var(--shadow-color);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            overflow: hidden;

            position: relative;

            display: flex;
            flex-direction: column;

            transition: all .5s ease;
        }

        .progress-wrapper {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background: rgba(128,128,128,.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--accent)
                );

            transition:
                width .4s cubic-bezier(.25,1,.5,1);

            box-shadow: 0 0 10px var(--primary);
        }

        h1 {
            margin: 10px 0;

            font-size: 1.6rem;

            text-align: center;

            font-weight: 800;
        }

        .subtitle {
            color: var(--text-sub);

            font-size: .9rem;

            text-align: center;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .form-control {
            width: 100%;

            background: var(--input-bg);

            border: 2px solid var(--border-color);

            color: var(--text-main);

            padding: 14px;

            border-radius: 14px;

            margin-top: 10px;

            font-family: inherit;

            font-size: 1rem;

            transition: .25s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .form-control::placeholder {
            color: var(--text-sub);
            opacity: .6;
        }

        .radio-option {
            width: 100%;

            background: var(--input-bg);

            border: 2px solid var(--border-color);

            color: var(--text-main);

            padding: 14px;

            border-radius: 14px;

            margin-bottom: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;

            font-weight: 500;

            transition: .2s;
        }

        .radio-option input {
            display: none;
        }

        .radio-option:active {
            transform: scale(.98);
        }

        .radio-option:has(input:checked) {
            border-color: var(--primary);

            color: var(--primary);

            box-shadow:
                inset 0 0 0 1px var(--primary);

            font-weight: bold;
        }

        .range-wrap {
            padding: 20px 0;
        }

        input[type=range] {
            width: 100%;

            accent-color: var(--primary);

            cursor: pointer;
        }

        .range-display {
            text-align: center;

            color: var(--primary);

            font-size: 1.5rem;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .nav-buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        button {
            border: none;

            border-radius: 14px;

            padding: 15px;

            width: 100%;

            font-family: inherit;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        .btn-primary {
            background: var(--primary);

            color: #fff;

            flex: 2;
        }

        .btn-secondary {
            background: transparent;

            border: 2px solid var(--border-color);

            color: var(--text-sub);

            flex: 1;
        }

        body:not([class]) .btn-primary,
        body.theme-cyberpunk .btn-primary {
            color: #1e272e;
        }

        body.theme-frost .btn-primary {
            background: rgba(255,255,255,.9);

            color: #6c5ce7;
        }

        .social-links {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 25px;
        }

        .social-btn {
            background: rgba(128,128,128,.1);

            border: 1px solid var(--border-color);

            color: var(--text-main);

            text-decoration: none;

            padding: 10px 20px;

            border-radius: 12px;

            transition: .2s;
        }

        .social-btn:hover {
            transform: translateY(-3px);

            border-color: var(--primary);

            color: var(--primary);
        }

        .signature {
            margin-top: 30px;

            margin-bottom: 10px;

            font-size: .8rem;

            color: var(--text-sub);

            opacity: .7;
        }

        .signature span {
            color: var(--primary);

            font-weight: bold;

            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        .fade-enter {
            animation: fadeEnter .4s ease forwards;

            opacity: 0;

            transform: translateY(10px);
        }

        @keyframes fadeEnter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 4px solid var(--border-color);

            border-top-color: var(--primary);

            animation: spin .8s linear infinite;

            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           QUESTION ANIMATION
        ========================================= */

        .question-transition-in {
            animation: questionIn .35s cubic-bezier(.22,1,.36,1);
        }

        @keyframes questionIn {
            from {
                opacity: 0;
                transform: translateX(18px) translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(0);
            }
        }

        /* =========================================
           THEME SWITCHER
        ========================================= */

        .theme-fab {
            position: fixed;

            left: 20px;
            bottom: 20px;

            width: 58px;
            height: 58px;

            border-radius: 50%;

            border: 1px solid var(--border-color);

            background: var(--card-bg);

            color: var(--text-main);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            box-shadow: 0 10px 25px var(--shadow-color);

            backdrop-filter: blur(14px);

            transition: .25s;
        }

        .theme-fab:hover {
            transform: translateY(-4px) scale(1.04);
        }

        .theme-panel {
            position: fixed;

            left: 20px;
            bottom: 90px;

            width: 220px;

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 20px;

            padding: 14px;

            backdrop-filter: blur(14px);

            box-shadow: 0 20px 40px var(--shadow-color);

            opacity: 0;

            pointer-events: none;

            transform: translateY(10px);

            transition: .25s;

            z-index: 9999;
        }

        .theme-panel.active {
            opacity: 1;

            pointer-events: auto;

            transform: translateY(0);
        }

        .theme-option {
            padding: 12px;

            border-radius: 12px;

            cursor: pointer;

            margin-bottom: 8px;

            color: var(--text-main);

            border: 1px solid transparent;

            transition: .2s;
        }

        .theme-option:hover {
            background: rgba(128,128,128,.08);

            border-color: var(--border-color);
        }

        .theme-option.active {
            border-color: var(--primary);

            color: var(--primary);

            font-weight: bold;
        }

        /* =========================================
           ERROR UI
        ========================================= */

        .error-box {
            background: rgba(255,71,87,.12);

            border: 1px solid rgba(255,71,87,.35);

            color: #ff6b81;

            padding: 14px;

            border-radius: 14px;

            line-height: 1.7;

            margin-top: 18px;

            animation: fadeEnter .3s ease;
        }

        /* =========================================
           MINIMAL THEME SPECIAL
        ========================================= */

        body.theme-minimal .container {
            border: none;
            box-shadow: none;

            border-bottom: 2px solid #000;

            border-radius: 0;

            background: transparent;
        }

        body.theme-minimal .btn-primary {
            border-radius: 0;

            background: #000;

            border: 2px solid #000;

            color: #fff;
        }

        body.theme-minimal .form-control,
        body.theme-minimal .radio-option {
            border: none;

            border-bottom: 1px solid #ddd;

            border-radius: 0;

            background: transparent;
        }

        @media (max-width:480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }
        }

    </style>
</head>
<body>

    <div class="background-animation">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="container">

        <div class="progress-wrapper">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="loader" class="loader"></div>

        <!-- START -->

        <div id="start-screen" class="hidden fade-enter">

            <h1 id="site-title">...</h1>

            <p id="site-subtitle" class="subtitle">...</p>

            <div style="text-align:right;">

                <label style="display:block;margin-bottom:5px;font-size:.9rem;">
                    نام شما
                </label>

                <input
                    type="text"
                    id="user-name"
                    class="form-control"
                    placeholder="وارد کنید..."
                >

                <br>

                <label style="display:block;margin-bottom:5px;font-size:.9rem;">
                    سن
                </label>

                <input
                    type="number"
                    id="user-age"
                    class="form-control"
                    placeholder="مثال: 22"
                >

            </div>

            <div class="nav-buttons">
                <button
                    class="btn-primary"
                    id="btn-start"
                    onclick="startQuiz()"
                >
                    شروع
                </button>
            </div>

        </div>

        <!-- QUIZ -->

        <div id="quiz-screen" class="hidden">

            <div id="question-box" class="fade-enter"></div>

            <div class="nav-buttons">

                <button
                    class="btn-secondary"
                    id="btn-prev"
                    onclick="prevStep()"
                >
                    قبلی
                </button>

                <button
                    class="btn-primary"
                    id="btn-next"
                    onclick="nextStep()"
                >
                    بعدی
                </button>

            </div>

        </div>

        <!-- END -->

        <div
            id="end-screen"
            class="hidden fade-enter"
            style="text-align:center;padding-top:20px;"
        >

            <div
                id="end-emoji"
                style="font-size:4rem;margin-bottom:10px;"
            >
                🎉
            </div>

            <h2 id="end-title" style="color:var(--primary);">
                ثبت شد!
            </h2>

            <p id="end-msg" style="color:var(--text-sub);">
                اطلاعات ذخیره شد.
            </p>

            <div id="social-area" class="social-links hidden"></div>

        </div>

    </div>

    <!-- THEME SWITCHER -->

    <div class="theme-panel" id="theme-panel">

        <div class="theme-option" data-theme="neon">Neon</div>
        <div class="theme-option" data-theme="crimson">Crimson</div>
        <div class="theme-option" data-theme="corporate">Corporate</div>
        <div class="theme-option" data-theme="minimal">Minimal</div>
        <div class="theme-option" data-theme="cyberpunk">Cyberpunk</div>
        <div class="theme-option" data-theme="nature">Nature</div>
        <div class="theme-option" data-theme="frost">Frost</div>

    </div>

    <button class="theme-fab" id="theme-fab">
        🎨
    </button>

    <div class="signature">
        Designed for <span>Economic Research</span> © 2025
    </div>

    <script>

        // ******************************************************
        // API URL
        // ******************************************************

        const API_URL =
            "https://script.google.com/macros/s/AKfycbzxljrF2WvzSJ0xFtxEoFh8Y5QSwg-Kp2LxO-nSJzzoZ10JzYdqcWk3g0vwrHg4Dru0AA/exec";

        // ******************************************************

        let questions = [];
        let config = {};
        let answers = {};
        let currentStep = 0;
        let timeLogs = {};

        let questionStartTime = Date.now();

        let autoAdvanceTimeout = null;

        const urlParams =
            new URLSearchParams(window.location.search);

        const sourceRef =
            urlParams.get('ref') || 'direct';

        const THEMES = [
            'neon',
            'crimson',
            'corporate',
            'minimal',
            'cyberpunk',
            'nature',
            'frost'
        ];

        /* =========================================
           THEME SYSTEM
        ========================================= */

        function applyTheme(theme) {

            THEMES.forEach(t => {
                document.body.classList.remove(`theme-${t}`);
            });

            if (theme !== 'neon') {
                document.body.classList.add(`theme-${theme}`);
            }

            localStorage.setItem(
                'econ_theme',
                theme
            );

            document
                .querySelectorAll('.theme-option')
                .forEach(el => {

                    el.classList.toggle(
                        'active',
                        el.dataset.theme === theme
                    );
                });
        }

        function initThemeSystem() {

            const savedTheme =
                localStorage.getItem('econ_theme') ||
                config.theme ||
                'neon';

            applyTheme(savedTheme);

            const panel =
                document.getElementById('theme-panel');

            document
                .getElementById('theme-fab')
                .addEventListener('click', () => {

                    panel.classList.toggle('active');
                });

            document
                .querySelectorAll('.theme-option')
                .forEach(el => {

                    el.addEventListener('click', () => {

                        applyTheme(el.dataset.theme);

                        panel.classList.remove('active');
                    });
                });
        }

        /* =========================================
           ERROR UI
        ========================================= */

        function showError(message) {

            let oldError =
                document.querySelector('.error-box');

            if (oldError) oldError.remove();

            const error =
                document.createElement('div');

            error.className = 'error-box';

            error.innerHTML = `
                <strong>خطا:</strong><br>
                ${message}
            `;

            document
                .querySelector('.container')
                .appendChild(error);
        }

        /* =========================================
           INIT
        ========================================= */

        window.onload = async () => {

            try {

                const res =
                    await fetch(API_URL);

                const data =
                    await res.json();

                document
                    .getElementById('loader')
                    .classList.add('hidden');

                if (data.config) {

                    config = data.config;

                    initThemeSystem();

                    const completedQuizzes =
                        JSON.parse(
                            localStorage.getItem(
                                'completed_quizzes'
                            ) || "[]"
                        );

                    if (
                        config.title &&
                        completedQuizzes.includes(config.title)
                    ) {

                        document
                            .getElementById('end-screen')
                            .classList.remove('hidden');

                        document
                            .getElementById('end-title')
                            .innerText =
                                "قبلاً شرکت کرده‌اید";

                        document
                            .getElementById('end-msg')
                            .innerHTML =
                                config.msg_duplicate ||
                                `شما قبلاً در آزمون شرکت کرده‌اید.`;

                        document
                            .getElementById('end-emoji')
                            .innerText =
                                config.emoji_duplicate || "✋";

                        renderSocialLinks();

                        return;
                    }

                    if (config.title)
                        document
                            .getElementById('site-title')
                            .innerText = config.title;

                    if (config.subtitle)
                        document
                            .getElementById('site-subtitle')
                            .innerText = config.subtitle;

                    if (config.btn_start)
                        document
                            .getElementById('btn-start')
                            .innerText = config.btn_start;

                    if (config.success_msg)
                        document
                            .getElementById('end-msg')
                            .innerText = config.success_msg;

                    if (config.end_emoji)
                        document
                            .getElementById('end-emoji')
                            .innerText = config.end_emoji;
                }

                if (!data.active) {

                    document.querySelector('.container').innerHTML = `
                        <div style="text-align:center;padding:20px;">
                            <h2>⛔ آزمون غیرفعال است</h2>
                        </div>
                    `;

                    return;
                }

                questions = data.questions;

                document
                    .getElementById('start-screen')
                    .classList.remove('hidden');

            } catch (e) {

                console.error(e);

                showError(
                    "خطا در اتصال به سرور."
                );
            }
        };

        /* =========================================
           START QUIZ
        ========================================= */

        function startQuiz() {

            const name =
                document.getElementById('user-name').value;

            const age =
                document.getElementById('user-age').value;

            if (!name || !age) {

                showError(
                    "لطفاً نام و سن را تکمیل کنید."
                );

                return;
            }

            document
                .getElementById('start-screen')
                .classList.add('hidden');

            document
                .getElementById('quiz-screen')
                .classList.remove('hidden');

            currentStep = 0;

            showQuestion(currentStep);
        }

        /* =========================================
           SHOW QUESTION
        ========================================= */

       function showQuestion(index) {

    const qBox =
        document.getElementById('question-box');

    const q = questions[index];

    document.querySelector(
        '.progress-bar'
    ).style.width =
        `${((index + 1) / questions.length) * 100}%`;

    questionStartTime = Date.now();

    const badge =
        q.required
            ? '<span style="color:#ff4757;">*</span>'
            : '';

    let inputHtml = '';

    const savedAns =
        answers[q.id] || "";

    if (q.type === 'radio') {

        q.options.forEach(opt => {

            const checked =
                savedAns === opt
                    ? 'checked'
                    : '';

            inputHtml += `
                <label class="radio-option">

                    <input
                        type="radio"
                        name="q_${q.id}"
                        value="${opt}"
                        ${checked}
                        onchange="handleRadioAnswer(${q.id}, '${opt}')"
                    >

                    ${opt}

                </label>
            `;
        });

    } else if (q.type === 'text') {

        inputHtml = `
            <textarea
                class="form-control"
                rows="4"
                placeholder="پاسخ دهید..."
                oninput="saveAns(${q.id}, this.value)"
            >${savedAns}</textarea>
        `;

    } else if (q.type === 'number') {

        inputHtml = `
            <input
                type="number"
                class="form-control"
                value="${savedAns}"
                placeholder="عدد"
                oninput="saveAns(${q.id}, this.value)"
            >
        `;

    } else if (q.type === 'range') {

        const val = savedAns || "50";

        if (!savedAns)
            saveAns(q.id, val);

        inputHtml = `
            <div class="range-wrap">

                <div
                    class="range-display"
                    id="val_disp"
                >
                    ${val}%
                </div>

                <input
                    type="range"
                    min="0"
                    max="100"
                    value="${val}"
                    oninput="
                        document.getElementById('val_disp').innerText=this.value+'%';
                        saveAns(${q.id}, this.value)
                    "
                >

            </div>
        `;
    }

    qBox.innerHTML = `
        <h3 style="
            margin-bottom:20px;
            line-height:1.7;
            font-size:1.1rem;
        ">
            ${badge}
            ${index + 1}. ${q.text}
        </h3>

        ${inputHtml}
    `;

    qBox.classList.remove(
        'question-transition-in'
    );

    void qBox.offsetWidth;

    qBox.classList.add(
        'question-transition-in'
    );

    document
        .getElementById('btn-prev')
        .style.visibility =
            index === 0
                ? 'hidden'
                : 'visible';

    const nextBtn =
        document.getElementById('btn-next');

    if (index === questions.length - 1) {

        nextBtn.innerText =
            config.btn_submit ||
            "ثبت نهایی";

        nextBtn.style.background =
            "#2ed573";

        nextBtn.style.color =
            "#fff";

    } else {

        nextBtn.innerText =
            "بعدی";

        nextBtn.style.background =
            "";

        nextBtn.style.color =
            "";
    }
}
        /* =========================================
           ANSWERS
        ========================================= */

        function saveAns(qid, val) {

            // ساختار اصلی حفظ شده

            answers[qid] = val;
        }

        function handleRadioAnswer(qid, val) {

            saveAns(qid, val);

            clearTimeout(autoAdvanceTimeout);

            autoAdvanceTimeout =
                setTimeout(() => {

                    if (
                        currentStep <
                        questions.length - 1
                    ) {
                        nextStep();
                    }

                }, 350);
        }

        /* =========================================
           NAVIGATION
        ========================================= */

        function nextStep() {

            const q =
                questions[currentStep];

            if (
                q.required &&
                !answers[q.id]
            ) {

                showError(
                    "پاسخ به این سوال الزامی است."
                );

                return;
            }

            const qId =
                questions[currentStep].id;

            timeLogs[qId] =
                (
                    (Date.now() - questionStartTime)
                    / 1000
                ).toFixed(1);

            if (
                currentStep ===
                questions.length - 1
            ) {

                submitData();

            } else {

                currentStep++;

                showQuestion(currentStep);
            }
        }

        function prevStep() {

            if (currentStep > 0) {

                currentStep--;

                showQuestion(currentStep);
            }
        }

        /* =========================================
           SUBMIT DATA
        ========================================= */

        async function submitData() {

            const btn =
                document.getElementById('btn-next');

            btn.disabled = true;

            btn.innerText = "ارسال...";

            // ⚠️ ساختار اصلی حفظ شده

            const answersPayload =
                Object.keys(answers).map(k => ({
                    qId: k,
                    answer: answers[k],
                    time: timeLogs[k] || 0
                }));

            // ⚠️ payload حفظ شده

            const payload = {
                name:
                    document.getElementById('user-name').value,

                age:
                    document.getElementById('user-age').value,

                source: sourceRef,

                answers: answersPayload
            };

            try {

                const response =
                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });

                if (!response.ok) {
                    throw new Error();
                }

                const completedQuizzes =
                    JSON.parse(
                        localStorage.getItem(
                            'completed_quizzes'
                        ) || "[]"
                    );

                if (
                    config.title &&
                    !completedQuizzes.includes(
                        config.title
                    )
                ) {

                    completedQuizzes.push(
                        config.title
                    );

                    localStorage.setItem(
                        'completed_quizzes',
                        JSON.stringify(
                            completedQuizzes
                        )
                    );
                }

                document
                    .getElementById('quiz-screen')
                    .classList.add('hidden');

                document
                    .getElementById('end-screen')
                    .classList.remove('hidden');

                renderSocialLinks();

            } catch (e) {

                console.error(e);

                showError(
                    "ارسال اطلاعات با مشکل مواجه شد. لطفاً دوباره تلاش کنید."
                );

                btn.disabled = false;

                btn.innerText = "تلاش مجدد";
            }
        }

        /* =========================================
           SOCIAL LINKS
        ========================================= */

        function renderSocialLinks() {

            const container =
                document.getElementById('social-area');

            let html = '';

            if (config.link_twitter) {

                html += `
                    <a
                        href="${config.link_twitter}"
                        target="_blank"
                        class="social-btn"
                    >
                        Twitter
                    </a>
                `;
            }

            if (config.link_telegram) {

                html += `
                    <a
                        href="${config.link_telegram}"
                        target="_blank"
                        class="social-btn"
                    >
                        Telegram
                    </a>
                `;
            }

            if (config.link_linkedin) {

                html += `
                    <a
                        href="${config.link_linkedin}"
                        target="_blank"
                        class="social-btn"
                    >
                        LinkedIn
                    </a>
                `;
            }

            if (html) {

                container.innerHTML = html;

                container.classList.remove('hidden');
            }
        }

    </script>
