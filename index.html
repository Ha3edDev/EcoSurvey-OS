<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Survey Web App</title>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
        rel="stylesheet">

    <style>
        /* =========================================
           THEMES
        ========================================= */

        :root {
            --font-main: 'Vazirmatn', sans-serif;

            --primary: #00d2d3;
            --accent: #54a0ff;

            --bg-body: #1e272e;
            --card-bg: rgba(47, 54, 64, 0.95);

            --text-main: #f5f6fa;
            --text-sub: #a4b0be;

            --border-color: #576574;
            --input-bg: rgba(0, 0, 0, 0.25);

            --shadow-color: rgba(0, 0, 0, 0.4);

            --blob-1: #00d2d3;
            --blob-2: #5f27cd;

            --blob-opacity: 0.3;

            --radius: 24px;
        }

        body.theme-crimson {
            --primary: #990033;
            --accent: #ff4757;

            --bg-body: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.95);

            --text-main: #2d3436;
            --text-sub: #636e72;

            --border-color: #dfe6e9;
            --input-bg: #f1f2f6;

            --shadow-color: rgba(0, 0, 0, 0.08);

            --blob-1: #ffcbd6;
            --blob-2: #e0e7ff;
        }

        body.theme-corporate {
            --primary: #0984e3;
            --accent: #74b9ff;

            --bg-body: #f1f2f6;
            --card-bg: #ffffff;

            --text-main: #2d3436;
            --text-sub: #636e72;

            --border-color: #dfe6e9;
            --input-bg: #f8f9fa;

            --shadow-color: rgba(0, 0, 0, 0.08);

            --blob-1: #74b9ff;
            --blob-2: #81ecec;
        }

        body.theme-nature {
            --primary: #2d6a4f;
            --accent: #95d5b2;

            --bg-body: #eaf4f4;
            --card-bg: rgba(255, 255, 255, 0.95);

            --text-main: #1b4332;
            --text-sub: #52796f;

            --border-color: #b7e4c7;
            --input-bg: #f0fff4;

            --shadow-color: rgba(45, 106, 79, 0.08);

            --blob-1: #95d5b2;
            --blob-2: #d8f3dc;
        }

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            overflow-x: hidden;

            background: var(--bg-body);

            font-family: var(--font-main);

            color: var(--text-main);

            transition: 0.4s ease;
        }

        .background-animation {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: var(--blob-opacity);
            animation: float 25s infinite alternate linear;
        }

        .blob.one {
            top: -10%;
            left: -10%;
            background: var(--blob-1);
        }

        .blob.two {
            bottom: -10%;
            right: -10%;
            background: var(--blob-2);
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(30px, -30px);
            }
        }

        .container {
            width: 100%;
            max-width: 430px;

            position: relative;

            overflow: hidden;

            border-radius: var(--radius);

            background: var(--card-bg);

            border: 1px solid var(--border-color);

            backdrop-filter: blur(12px);

            padding: 35px 25px;

            box-shadow: 0 25px 50px var(--shadow-color);

            transition: 0.4s ease;
        }

        .progress-wrapper {
            position: absolute;
            top: 0;
            right: 0;

            width: 100%;
            height: 5px;

            background: rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background: linear-gradient(90deg,
                    var(--primary),
                    var(--accent));

            transition: width 0.4s ease;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-sub);

            line-height: 1.8;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;

            border: 2px solid var(--border-color);

            background: var(--input-bg);

            color: var(--text-main);

            border-radius: 14px;

            padding: 14px;

            font-family: inherit;
            font-size: 1rem;

            transition: 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .form-control::placeholder {
            color: var(--text-sub);
        }

        .radio-option {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 14px;

            border-radius: 14px;

            border: 2px solid var(--border-color);

            margin-bottom: 12px;

            cursor: pointer;

            background: var(--input-bg);

            transition: 0.25s ease;
        }

        .radio-option:hover {
            transform: translateY(-2px);
        }

        .radio-option input {
            display: none;
        }

        .radio-option:has(input:checked) {
            border-color: var(--primary);

            color: var(--primary);

            font-weight: bold;

            box-shadow: 0 0 0 1px var(--primary);
        }

        .nav-buttons {
            display: flex;
            gap: 12px;

            margin-top: 25px;
        }

        button {
            border: none;

            cursor: pointer;

            border-radius: 14px;

            padding: 15px;

            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;

            transition: 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            flex: 2;

            background: var(--primary);

            color: #fff;
        }

        .btn-secondary {
            flex: 1;

            background: transparent;

            border: 2px solid var(--border-color);

            color: var(--text-sub);
        }

        .screen {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none !important;
        }

        .loader {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 4px solid var(--border-color);
            border-top-color: var(--primary);

            animation: spin 0.8s linear infinite;

            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           THEME SELECTOR
        ========================================= */

        .theme-selector {
            margin-top: 25px;
        }

        .theme-title {
            text-align: center;

            margin-bottom: 14px;

            color: var(--text-sub);

            font-size: 0.9rem;
        }

        .theme-options {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .theme-btn {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            border: 3px solid transparent;

            cursor: pointer;
        }

        .theme-btn.active {
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .theme-btn.neon {
            background: linear-gradient(135deg,
                    #00d2d3,
                    #5f27cd);
        }

        .theme-btn.crimson {
            background: linear-gradient(135deg,
                    #990033,
                    #ff4757);
        }

        .theme-btn.corporate {
            background: linear-gradient(135deg,
                    #0984e3,
                    #74b9ff);
        }

        .theme-btn.nature {
            background: linear-gradient(135deg,
                    #2d6a4f,
                    #95d5b2);
        }

        /* =========================================
           REFERRAL
        ========================================= */

        .referral-box {
            margin-top: 25px;
            text-align: right;
        }

        .referral-box label {
            display: block;
            margin-bottom: 10px;

            color: var(--text-sub);
        }

        .referral-row {
            display: flex;
            gap: 10px;
        }

        .copy-btn {
            min-width: 90px;

            background: var(--primary);

            color: white;
        }

        .signature {
            margin-top: 25px;

            color: var(--text-sub);

            font-size: 0.8rem;
        }

        .signature span {
            color: var(--primary);
            font-weight: bold;
        }

        @media (max-width: 480px) {

            body {
                padding: 14px;
            }

            .container {
                padding: 25px 18px;
            }

            .referral-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="background-animation">
        <div class="blob one"></div>
        <div class="blob two"></div>
    </div>

    <div class="container">

        <div class="progress-wrapper">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="loader" class="loader"></div>

        <!-- START SCREEN -->

        <div id="start-screen" class="screen hidden">

            <h1 id="site-title">سامانه نظرسنجی</h1>

            <p id="site-subtitle" class="subtitle">
                لطفاً اطلاعات خود را وارد کنید
            </p>

            <div class="form-group">
                <label class="label">نام</label>

                <input type="text"
                    id="user-name"
                    class="form-control"
                    placeholder="نام شما">
            </div>

            <div class="form-group">
                <label class="label">سن</label>

                <input type="number"
                    id="user-age"
                    class="form-control"
                    placeholder="مثلاً 22">
            </div>

            <!-- THEMES -->

            <div class="theme-selector">

                <div class="theme-title">
                    انتخاب تم
                </div>

                <div class="theme-options">

                    <button class="theme-btn neon"
                        onclick="changeTheme('neon')"></button>

                    <button class="theme-btn crimson"
                        onclick="changeTheme('crimson')"></button>

                    <button class="theme-btn corporate"
                        onclick="changeTheme('corporate')"></button>

                    <button class="theme-btn nature"
                        onclick="changeTheme('nature')"></button>

                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn-primary"
                    onclick="startQuiz()">
                    شروع آزمون
                </button>
            </div>

        </div>

        <!-- QUIZ SCREEN -->

        <div id="quiz-screen" class="screen hidden">

            <div id="question-box"></div>

            <div class="nav-buttons">

                <button class="btn-secondary"
                    id="btn-prev"
                    onclick="prevStep()">
                    قبلی
                </button>

                <button class="btn-primary"
                    id="btn-next"
                    onclick="nextStep()">
                    بعدی
                </button>

            </div>

        </div>

        <!-- END SCREEN -->

        <div id="end-screen"
            class="screen hidden"
            style="text-align:center;">

            <div style="font-size:4rem;">
                🎉
            </div>

            <h2 style="color:var(--primary);">
                ثبت شد
            </h2>

            <p style="color:var(--text-sub);">
                پاسخ‌های شما با موفقیت ذخیره شد.
            </p>

            <!-- REFERRAL -->

            <div class="referral-box">

                <label>
                    لینک دعوت اختصاصی شما
                </label>

                <div class="referral-row">

                    <input type="text"
                        id="referral-link"
                        class="form-control"
                        readonly>

                    <button class="copy-btn"
                        onclick="copyReferralLink()">
                        کپی
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="signature">
        Designed for <span>Economic Research</span>
    </div>

    <script>

        /* =========================================
           CONFIG
        ========================================= */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbzxljrF2WvzSJ0xFtxEoFh8Y5QSwg-Kp2LxO-nSJzzoZ10JzYdqcWk3g0vwrHg4Dru0AA/exec";

        /* =========================================
           STATE
        ========================================= */

        const state = {

            currentScreen: "start",

            currentQuestion: 0,

            questions: [],

            answers: {},

            timeLogs: {},

            config: {},

            currentTheme: "neon"

        };

        let questionStartTime = 0;

        /* =========================================
           DOM
        ========================================= */

        const screens = {

            start:
                document.getElementById("start-screen"),

            quiz:
                document.getElementById("quiz-screen"),

            end:
                document.getElementById("end-screen")

        };

        /* =========================================
           INIT
        ========================================= */

        window.addEventListener(
            "DOMContentLoaded",
            initApp
        );

        async function initApp() {

            loadTheme();

            try {

                const response =
                    await fetch(API_URL);

                const data =
                    await response.json();

                state.questions =
                    data.questions || [];

                state.config =
                    data.config || {};

                initializeUI();

                setScreen("start");

            } catch (error) {

                console.error(error);

                alert("خطا در اتصال");

            } finally {

                document.getElementById("loader")
                    .classList.add("hidden");

            }
        }

        /* =========================================
           UI
        ========================================= */

        function setScreen(screenName) {

            Object.values(screens)
                .forEach(screen => {

                    screen.classList.add("hidden");

                });

            screens[screenName]
                .classList.remove("hidden");

            state.currentScreen = screenName;
        }

        function initializeUI() {

            const config = state.config;

            if (config.title) {

                document.getElementById("site-title")
                    .innerText = config.title;
            }

            if (config.subtitle) {

                document.getElementById("site-subtitle")
                    .innerText = config.subtitle;
            }
        }

        /* =========================================
           THEMES
        ========================================= */

        function changeTheme(themeName) {

            document.body.className = "";

            if (themeName !== "neon") {

                document.body.classList.add(
                    `theme-${themeName}`
                );
            }

            localStorage.setItem(
                "survey_theme",
                themeName
            );

            state.currentTheme = themeName;

            updateThemeButtons(themeName);
        }

        function loadTheme() {

            const savedTheme =
                localStorage.getItem("survey_theme")
                || "neon";

            changeTheme(savedTheme);
        }

        function updateThemeButtons(activeTheme) {

            document.querySelectorAll(".theme-btn")
                .forEach(btn => {

                    btn.classList.remove("active");

                    if (btn.classList.contains(activeTheme)) {

                        btn.classList.add("active");
                    }
                });
        }

        /* =========================================
           QUIZ
        ========================================= */

        function startQuiz() {

            const name =
                document.getElementById("user-name")
                    .value.trim();

            const age =
                document.getElementById("user-age")
                    .value.trim();

            if (!name || !age) {

                alert("لطفاً اطلاعات را کامل کنید");

                return;
            }

            state.currentQuestion = 0;

            setScreen("quiz");

            showQuestion();
        }

        function showQuestion() {

            const question =
                state.questions[state.currentQuestion];

            const questionBox =
                document.getElementById("question-box");

            updateProgress();

            questionStartTime = Date.now();

            const savedAnswer =
                state.answers[question.id] || "";

            let optionsHTML = "";

            if (question.type === "radio") {

                optionsHTML =
                    question.options.map(option => {

                        const checked =
                            savedAnswer === option
                                ? "checked"
                                : "";

                        return `
                            <label class="radio-option">

                                <input
                                    type="radio"
                                    name="question"
                                    value="${option}"
                                    ${checked}
                                    onchange="saveAnswer('${question.id}','${option}')"
                                >

                                ${option}

                            </label>
                        `;

                    }).join("");
            }

            if (question.type === "text") {

                optionsHTML = `
                    <textarea
                        class="form-control"
                        rows="4"
                        placeholder="پاسخ خود را وارد کنید..."
                        oninput="saveAnswer('${question.id}', this.value)"
                    >${savedAnswer}</textarea>
                `;
            }

            if (question.type === "number") {

                optionsHTML = `
                    <input
                        type="number"
                        class="form-control"
                        value="${savedAnswer}"
                        placeholder="عدد"
                        oninput="saveAnswer('${question.id}', this.value)"
                    >
                `;
            }

            questionBox.innerHTML = `

                <h3 style="line-height:1.8; margin-bottom:20px;">

                    ${state.currentQuestion + 1}.
                    ${question.text}

                </h3>

                ${optionsHTML}
            `;

            updateNavigationButtons();
        }

        function saveAnswer(questionId, value) {

            state.answers[questionId] = value;
        }

        function nextStep() {

            const question =
                state.questions[state.currentQuestion];

            if (
                question.required &&
                !state.answers[question.id]
            ) {

                alert("این سوال الزامی است");

                return;
            }

            state.timeLogs[question.id] =
                (
                    (Date.now() - questionStartTime)
                    / 1000
                ).toFixed(1);

            if (
                state.currentQuestion >=
                state.questions.length - 1
            ) {

                submitData();

                return;
            }

            state.currentQuestion++;

            showQuestion();
        }

        function prevStep() {

            if (state.currentQuestion <= 0)
                return;

            state.currentQuestion--;

            showQuestion();
        }

        function updateNavigationButtons() {

            const prevBtn =
                document.getElementById("btn-prev");

            const nextBtn =
                document.getElementById("btn-next");

            prevBtn.style.visibility =
                state.currentQuestion === 0
                    ? "hidden"
                    : "visible";

            nextBtn.innerText =
                state.currentQuestion ===
                    state.questions.length - 1
                    ? "ثبت نهایی"
                    : "بعدی";
        }

        function updateProgress() {

            const progress =
                (
                    (state.currentQuestion + 1)
                    / state.questions.length
                ) * 100;

            document.getElementById("progress-bar")
                .style.width = `${progress}%`;
        }

        /* =========================================
           SUBMIT
        ========================================= */

        async function submitData() {

            const submitBtn =
                document.getElementById("btn-next");

            submitBtn.disabled = true;

            submitBtn.innerText =
                "در حال ارسال...";

            const payload = {

                name:
                    document.getElementById("user-name")
                        .value,

                age:
                    document.getElementById("user-age")
                        .value,

                ref:
                    new URLSearchParams(
                        window.location.search
                    ).get("ref") || "direct",

                theme:
                    state.currentTheme,

                answers:
                    Object.entries(state.answers)
                        .map(([qId, answer]) => ({

                            qId,

                            answer,

                            time:
                                state.timeLogs[qId]
                                || 0
                        }))
            };

            try {

                await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)

                });

                generateReferralLink();

                setScreen("end");

            } catch (error) {

                console.error(error);

                alert("خطا در ارسال اطلاعات");

                submitBtn.disabled = false;

                submitBtn.innerText =
                    "تلاش مجدد";
            }
        }

        /* =========================================
           REFERRAL
        ========================================= */

        function generateReferralLink() {

            const name =
                document.getElementById("user-name")
                    .value
                    .trim();

            const referralLink =
                `${window.location.origin}${window.location.pathname}?ref=${encodeURIComponent(name)}`;

            document.getElementById("referral-link")
                .value = referralLink;
        }

        async function copyReferralLink() {

            const input =
                document.getElementById("referral-link");

            try {

                await navigator.clipboard
                    .writeText(input.value);

                alert("لینک کپی شد");

            } catch {

                input.select();

                document.execCommand("copy");

                alert("لینک کپی شد");
            }
        }

    </script>

</body>

</html>
